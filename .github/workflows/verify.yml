name: Verificar HERS
on: pull_request
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.3.0
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - run: supabase start
      - name: Ejecutar integraciones SQL
        run: |
          for test in test/*.integration.sql; do
            psql --no-psqlrc --set ON_ERROR_STOP=1 \
              --dbname=postgresql://postgres:postgres@127.0.0.1:54322/postgres --file="$test"
          done
