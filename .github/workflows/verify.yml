name: Verificar HERS
on: pull_request
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.3.0
      - run: supabase start
      - name: Ejecutar integraciones SQL
        run: |
          for test in test/*.integration.sql; do
            docker exec -i supabase_db_hers-prueba psql --username=postgres \
              --dbname=postgres --no-psqlrc --set ON_ERROR_STOP=1 < "$test"
          done
