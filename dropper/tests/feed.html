<!doctype html><html lang="es"><meta charset="utf-8"><title>SIMULACIÓN de feed reciclado</title>
<style>
body{margin:0;background:#eef1f5;font:22px Arial;color:#233047}header{position:fixed;top:0;left:0;right:0;height:90px;background:#182b49;color:white;z-index:2;display:grid;place-items:center}
#spacer{position:relative;height:2400px;margin:115px auto 0;width:650px}.b-post{box-sizing:border-box;position:absolute;width:650px;padding:25px;background:white;border:2px solid #ddd;height:650px}
img{width:100%;height:260px;object-fit:cover}p{line-height:1.5}
</style><header>SIMULACIÓN — publicaciones ficticias — prueba de grabación</header><div id="spacer"></div>
<script>
const ids=['300','200','100'];const host=document.querySelector('#spacer');
function render(){
 for(let i=0;i<ids.length;i++){
  const top=115+i*700;const visible=top+650>scrollY-200 && top<scrollY+innerHeight+200;
  let el=document.getElementById('postId_'+ids[i]);
  if(!visible){el?.remove();continue;}
  if(!el){el=document.createElement('article');el.id='postId_'+ids[i];el.className='b-post';el.style.top=(i*700)+'px';
   el.innerHTML='<h2>Post ficticio '+ids[i]+'</h2><p>Prueba '+(i+1)+' de 3. Modelo de demostración.</p><img alt="Imagen ficticia"><p>Texto completo de prueba. Este post supera el área visible y debe recorrerse hasta el final.</p><p>FIN DEL POST '+ids[i]+'</p>';
   host.append(el);const img=el.querySelector('img');setTimeout(()=>img.src='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="600" height="260"><rect width="600" height="260" fill="'+['#537bba','#479b83','#bd735a'][i]+'"/><text x="30" y="140" font-size="42" fill="white">IMAGEN DE PRUEBA '+ids[i]+'</text></svg>'),350);
  }
 }
}
addEventListener('scroll',render);render();
</script></html>
